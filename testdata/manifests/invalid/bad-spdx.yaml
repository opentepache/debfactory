# want: license.spdx: "MIT/Apache" no es SPDX
schema: 1
name: bad-spdx
version: 1.0.0
revision: 1
level: 1
summary: example single static binary tool
description: |
  Placeholder showing the smallest valid manifest for a tool shipped as
  one static binary per architecture inside a tar.gz.
homepage: https://github.com/example/bad-spdx
upstream: example/bad-spdx
license:
  spdx: MIT/Apache
  file: {archive: LICENSE}
value: Not in Debian or Ubuntu; author has no APT repository; not in griffo.
arch_map: {amd64: x86_64, arm64: aarch64}
artifact:
  url: https://github.com/example/bad-spdx/releases/download/{{tag}}/bad-spdx-{{arch}}.tar.gz
  format: tar.gz
install:
  - {src: bad-spdx, dst: /usr/bin/}

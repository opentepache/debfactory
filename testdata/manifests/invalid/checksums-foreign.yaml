# want: checksums.url: fuera de los releases de example/checksums-foreign
schema: 1
name: checksums-foreign
version: 1.0.0
revision: 1
level: 1
summary: example single static binary tool
description: |
  Placeholder showing the smallest valid manifest for a tool shipped as
  one static binary per architecture inside a tar.gz.
homepage: https://github.com/example/checksums-foreign
upstream: example/checksums-foreign
license:
  spdx: MIT
  file: {archive: LICENSE}
value: Not in Debian or Ubuntu; author has no APT repository; not in griffo.
arch_map: {amd64: x86_64, arm64: aarch64}
artifact:
  url: https://github.com/example/checksums-foreign/releases/download/{{tag}}/checksums-foreign-{{arch}}.tar.gz
  format: tar.gz
checksums:
  url: https://github.com/other/x/releases/download/{{tag}}/sha256.txt
  format: sha256sum
install:
  - {src: checksums-foreign, dst: /usr/bin/}

# want: install: con artifact.format binary debe haber exactamente un elemento
schema: 1
name: binary-two-items
version: 1.0.0
revision: 1
level: 1
summary: example single static binary tool
description: |
  Placeholder showing the smallest valid manifest for a tool shipped as
  one static binary per architecture inside a tar.gz.
homepage: https://github.com/example/binary-two-items
upstream: example/binary-two-items
license:
  spdx: MIT
  file: {archive: LICENSE}
value: Not in Debian or Ubuntu; author has no APT repository; not in griffo.
arch_map: {amd64: x86_64, arm64: aarch64}
artifact:
  url: https://github.com/example/binary-two-items/releases/download/{{tag}}/binary-two-items-{{arch}}
  format: binary
install:
  - {src: '{{name}}', dst: /usr/bin/}
  - {src: '{{name}}', dst: /usr/bin/other}

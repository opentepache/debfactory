    bookworm: acotar la prueba del toolchain a trixie (specs/009 T051)
    forky: acotar la prueba del toolchain a trixie (specs/009 T051)
    sid: acotar la prueba del toolchain a trixie (specs/009 T051)
    noble: acotar la prueba del toolchain a trixie (specs/009 T051)
    resolute: acotar la prueba del toolchain a trixie (specs/009 T051)

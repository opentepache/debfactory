# SC-003: un binario estático simple, sin completions ni man pages (el archivo se llama como `name`).
schema: 1
name: example
version: 1.0.0
pav: 1
level: 1
summary: example single static binary tool
description: |
  Placeholder showing the smallest valid manifest for a tool shipped as
  one static binary per architecture inside a tar.gz.
homepage: https://github.com/example/example
upstream: example/example
license:
  spdx: MIT
  file: {archive: LICENSE}
value: Not in Debian or Ubuntu; author has no APT repository; not in griffo.
arch_map: {amd64: x86_64, arm64: aarch64}
artifact:
  url: https://github.com/example/example/releases/download/{{tag}}/example-{{arch}}.tar.gz
  format: tar.gz
install:
  - {src: example, dst: /usr/bin/}
lintian_overrides:
  - {tag: statically-linked-binary, path: /usr/bin/example, reason: Upstream binary is static by design; level 1 cannot relink it.}

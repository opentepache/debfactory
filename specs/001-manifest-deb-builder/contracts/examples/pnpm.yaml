schema: 1
name: pnpm
version: 12.18.0
revision: 1
summary: fast, disk space efficient package manager for Node.js
description: |
  pnpm installs Node.js dependencies into a content-addressable store and
  links them into projects. Standalone build that does not need Node.js.
homepage: https://pnpm.io
upstream: pnpm/pnpm
license:
  spdx: MIT
  file: {repo: LICENSE}
value: Not in Debian or Ubuntu; author has no APT repository; not in griffo.
arch_map: {amd64: x64, arm64: arm64}
artifact:
  url: https://github.com/pnpm/pnpm/releases/download/{{tag}}/pnpm-linux-{{arch}}.tar.gz
  format: tar.gz
install:
  - {src: pnpm, dst: /usr/lib/pnpm/}
  - {src: dist, dst: /usr/lib/pnpm/dist, type: tree}
links:
  - {path: /usr/bin/pnpm, target: /usr/lib/pnpm/pnpm}
completions:
  bash: {generate: /usr/lib/pnpm/pnpm completion bash}
  zsh: {generate: /usr/lib/pnpm/pnpm completion zsh}
  fish: {generate: /usr/lib/pnpm/pnpm completion fish}
test: {command: pnpm --version, expect: "{{version}}"}
